services:
  outreach-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in Coolify}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:?Set EVOLUTION_API_URL in Coolify}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY in Coolify}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Set N8N_WEBHOOK_SECRET in Coolify}
    volumes:
      - outreach_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  outreach_data:
